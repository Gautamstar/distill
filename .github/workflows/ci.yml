name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The scoring, validation and calibration code is pure Python; the model
      # stack stays out of CI so this stays fast and GPU-free.
      - run: pip install pydantic pytest
      - run: python -m pytest tests/ -q --ignore=tests/test_regression.py

  metrics:
    name: Metrics regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydantic pytest
      # Re-scores frozen predictions from real runs and asserts the numbers the
      # README publishes still fall out. Cannot catch model drift (no GPU), but
      # it fails the build if a change to the scorer, the validation rules or
      # the aggregation silently moves every headline figure.
      - run: python -m pytest tests/test_regression.py -q
