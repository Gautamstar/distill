name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Scorer tests only need pydantic + pytest; the model stack stays out of CI.
      - run: pip install pydantic pytest
      - run: python -m pytest tests/ -q
