<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Distill · Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Neutral grayscale surfaces; white is the interface accent (selection,
         primary action). Exactly one hue survives, and only semantically:
         amber marks fields a human still has to resolve. */
      --bg: #333333;
      --layer: #3c3c3c;
      --layer-2: #494949;
      --border: #585858;
      --border-soft: rgba(255, 255, 255, 0.10);
      --fg: #f7f7f7;
      --fg-dim: #c9c9c9;
      --fg-feint: #a2a2a2;
      --accent: #fafafa;
      --accent-hi: #ffffff;
      --accent-wash: rgba(255, 255, 255, 0.055);
      --flag: #c9a227;
      --flag-hi: #dcb64a;
      --flag-wash: rgba(201, 162, 39, 0.09);
      --ok: #7d9d84;
      --sans: Inter, system-ui, -apple-system, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --t: 0.16s;
      --top: 46px;
      --foot: 34px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    html { color-scheme: dark; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
      letter-spacing: -0.011em;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button, input { font: inherit; color: inherit; background: none; border: none; }
    button { cursor: pointer; }
    :focus-visible { outline: 1px solid var(--fg-dim); outline-offset: 2px; }
    ::selection { background: rgba(255, 255, 255, 0.18); }

    .kick {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--fg-feint);
    }
    .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    /* ── shell ── */
    .app {
      display: grid;
      grid-template-columns: 268px minmax(320px, 1fr) minmax(380px, 460px);
      grid-template-rows: var(--top) 1fr var(--foot);
      grid-template-areas: "top top top" "queue viewer inspector" "foot foot foot";
      height: 100%;
    }

    /* ── topbar ── */
    .topbar {
      grid-area: top;
      display: flex; align-items: center; gap: 20px;
      padding: 0 14px;
      background: var(--layer);
      border-bottom: 1px solid var(--border);
    }
    .mark {
      font-family: var(--mono); font-size: 12px; font-weight: 500;
      letter-spacing: 0.06em; white-space: nowrap;
    }
    .mark span { color: var(--fg-feint); }
    .metrics { display: flex; align-items: center; gap: 18px; margin-left: auto; }
    .metric { display: flex; align-items: baseline; gap: 7px; white-space: nowrap; }
    .metric b { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: 0; }
    .progress {
      width: 84px; height: 3px; background: var(--border);
      overflow: hidden;
    }
    .progress i {
      display: block; height: 100%; width: 0; background: var(--accent);
      transition: width 0.4s var(--ease);
    }

    /* ── queue ── */
    .queue {
      grid-area: queue;
      display: flex; flex-direction: column; min-height: 0;
      border-right: 1px solid var(--border);
      background: var(--layer);
    }
    .filters {
      display: flex; gap: 2px; padding: 8px;
      border-bottom: 1px solid var(--border);
    }
    .filters button {
      flex: 1; padding: 5px 0;
      font-family: var(--mono); font-size: 10px;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--fg-feint);
      transition: color var(--t), background var(--t);
    }
    .filters button:hover { color: var(--fg-dim); background: var(--border-soft); }
    .filters button.on { color: var(--fg); background: var(--layer-2); }
    .filters .count { color: var(--fg-dim); }
    .filters button[data-f="review"] .count { color: var(--flag-hi); }

    .list { flex: 1; overflow-y: auto; min-height: 0; }
    .group {
      position: sticky; top: 0; z-index: 2;
      padding: 9px 12px 6px;
      background: var(--layer);
      border-bottom: 1px solid var(--border-soft);
    }
    .row {
      display: grid; grid-template-columns: 26px 1fr auto;
      gap: 9px; align-items: center; width: 100%; text-align: left;
      padding: 8px 12px 8px 10px;
      border-left: 2px solid transparent;
      border-bottom: 1px solid var(--border-soft);
      transition: background var(--t), border-color var(--t);
    }
    .row:hover { background: var(--layer-2); }
    .row.on { background: var(--layer-2); border-left-color: var(--accent); }
    .row-i { font-family: var(--mono); font-size: 10px; color: var(--fg-feint); }
    .row-t {
      font-size: 13px; font-weight: 450; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .row.done .row-t { color: var(--fg-feint); }
    .pill {
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.02em;
      padding: 1px 6px; white-space: nowrap;
    }
    .pill.flag { color: var(--flag-hi); background: var(--flag-wash); }
    .pill.clear { color: var(--fg-feint); }
    .pill.done { color: var(--ok); }

    /* ── upload ── */
    .drop {
      display: block; margin: 8px; padding: 13px 10px;
      text-align: center; cursor: pointer;
      border: 1px dashed var(--border);
      transition: border-color var(--t), background var(--t);
    }
    .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-wash); }
    .drop.busy { cursor: default; border-style: solid; border-color: var(--accent); }
    .drop input { display: none; }
    .drop b { display: block; font-size: 12px; font-weight: 500; margin-bottom: 3px; }
    .opts {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 0 8px 9px;
    }
    .opts input { accent-color: var(--fg-dim); width: 12px; height: 12px; }
    .opts label { cursor: pointer; }
    .bar { height: 2px; margin-top: 8px; background: var(--border); overflow: hidden; }
    .bar i {
      display: block; height: 100%; width: 34%; background: var(--accent);
      animation: slide 1s var(--ease) infinite;
    }
    @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(400%); } }

    /* ── viewer ── */
    .viewer {
      grid-area: viewer;
      display: flex; align-items: center; justify-content: center;
      padding: 18px; overflow: auto; min-height: 0;
      background:
        linear-gradient(var(--border-soft) 1px, transparent 1px) 0 0 / 100% 28px,
        var(--bg);
    }
    .viewer img {
      max-width: 100%; max-height: 100%; width: auto; display: block;
      border: 1px solid var(--border);
      animation: pop 0.3s var(--ease);
    }
    @keyframes pop { from { opacity: 0; transform: scale(0.985); } to { opacity: 1; transform: none; } }

    /* ── inspector ── */
    .inspector {
      grid-area: inspector;
      display: flex; flex-direction: column; min-height: 0;
      background: var(--layer);
      border-left: 1px solid var(--border);
    }
    .insp-head { padding: 13px 16px 12px; border-bottom: 1px solid var(--border); }
    .insp-head h2 {
      font-size: 15px; font-weight: 600; letter-spacing: -0.015em;
      margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .fields { flex: 1; overflow-y: auto; min-height: 0; }

    .f {
      display: grid; grid-template-columns: 74px 1fr 70px;
      gap: 10px; align-items: center;
      padding: 9px 16px 9px 14px;
      border-left: 2px solid transparent;
      border-bottom: 1px solid var(--border-soft);
    }
    .f.flag { border-left-color: var(--flag); background: var(--flag-wash); }
    .f-k { font-family: var(--mono); font-size: 10px; text-transform: uppercase;
           letter-spacing: 0.1em; color: var(--fg-feint); }
    .f-v { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .f-v.none { color: var(--fg-feint); font-style: italic; }
    .f input {
      width: 100%; padding: 3px 0;
      font-family: var(--mono); font-size: 12.5px;
      border-bottom: 1px solid var(--border);
      transition: border-color var(--t);
    }
    .f input:focus { border-bottom-color: var(--accent); outline: none; }
    .f-s { text-align: right; }
    .f-tag { font-family: var(--mono); font-size: 9px; text-transform: uppercase;
             letter-spacing: 0.09em; }
    .f-tag.auto { color: var(--fg-feint); }
    .f-tag.rev { color: var(--flag-hi); }
    .meter { width: 46px; height: 2px; margin: 5px 0 0 auto; background: var(--border); }
    .meter i { display: block; height: 100%; background: var(--fg-feint);
               transition: width 0.35s var(--ease); }
    .f.flag .meter i { background: var(--flag); }

    .items { padding: 4px 16px 16px; }
    .item {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 5px 0; border-bottom: 1px solid var(--border-soft);
      font-family: var(--mono); font-size: 11.5px; color: var(--fg-dim);
    }

    .insp-foot {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 16px; border-top: 1px solid var(--border);
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 15px; background: var(--accent); color: var(--bg);
      font-size: 12.5px; font-weight: 550; letter-spacing: -0.005em;
      transition: background var(--t), transform var(--t);
    }
    .btn:hover { background: var(--accent-hi); }
    .btn:active { transform: translateY(1px); }
    .btn kbd {
      font-family: var(--mono); font-size: 10px; opacity: 0.55;
      border-left: 1px solid rgba(0,0,0,0.25);
      margin-left: 2px; padding-left: 8px;
    }
    .note { font-family: var(--mono); font-size: 10px; color: var(--fg-feint); }

    /* ── footer ── */
    .foot {
      grid-area: foot;
      display: flex; align-items: center; gap: 16px;
      padding: 0 14px;
      background: var(--layer); border-top: 1px solid var(--border);
    }
    .hint { display: flex; align-items: center; gap: 6px; }
    .hint kbd {
      font-family: var(--mono); font-size: 10px;
      padding: 1px 5px; color: var(--fg-dim);
      background: var(--layer-2); border: 1px solid var(--border);
    }
    .dot { width: 5px; height: 5px; background: var(--flag); animation: pulse 2.2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
    }
    @media (max-width: 1080px) {
      .app { grid-template-columns: 230px 1fr; grid-template-areas: "top top" "queue inspector" "foot foot"; }
      .viewer { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <span class="mark">DISTILL<span>/</span>REVIEW</span>
      <span class="kick" id="model-state">connecting</span>
      <div class="metrics">
        <span class="metric"><span class="kick">reviewed</span>
          <b class="num" id="m-progress">0/0</b>
          <span class="progress"><i id="m-bar"></i></span></span>
        <span class="metric"><span class="kick">auto-accepted</span><b class="num" id="m-auto">–</b></span>
        <span class="metric"><span class="kick">accept acc</span><b class="num" id="m-acc">–</b></span>
      </div>
    </header>

    <aside class="queue">
      <nav class="filters">
        <button data-f="review" class="on">Needs review <span class="count" id="c-review"></span></button>
        <button data-f="all">All <span class="count" id="c-all"></span></button>
        <button data-f="done">Done <span class="count" id="c-done"></span></button>
      </nav>
      <div class="list" id="list"></div>
      <label class="drop" id="drop">
        <b>Drop a receipt</b>
        <span class="kick" id="drop-note">or click to choose</span>
        <input type="file" id="file" accept="image/jpeg,image/png,image/webp" />
      </label>
      <div class="opts kick">
        <input type="checkbox" id="opt-items" />
        <label for="opt-items">include line items</label>
      </div>
    </aside>

    <main class="viewer"><img id="img" alt="receipt" /></main>

    <section class="inspector">
      <div class="insp-head">
        <span class="kick" id="insp-meta"></span>
        <h2 id="insp-title">No receipt selected</h2>
      </div>
      <div class="fields" id="fields"></div>
      <div class="insp-foot">
        <button class="btn" id="save">Approve <kbd>↵</kbd></button>
        <span class="note" id="save-note"></span>
      </div>
    </section>

    <footer class="foot">
      <span class="hint"><kbd>↑</kbd><kbd>↓</kbd><span class="kick">navigate</span></span>
      <span class="hint"><kbd>↵</kbd><span class="kick">approve &amp; next</span></span>
      <span class="hint"><kbd>tab</kbd><span class="kick">next field</span></span>
      <span class="hint" style="margin-left:auto"><span class="dot"></span>
        <span class="kick">flagged fields need a human</span></span>
    </footer>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"]/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const LABELS = {
      store_name: "Store", date: "Date", subtotal_price: "Subtotal",
      tax_price: "Tax", tip_price: "Tip", total_price: "Total",
    };

    let EVAL = [], UPLOADS = [], CURRENT = null, FILTER = "review";
    const all = () => UPLOADS.concat(EVAL);
    const visible = () => all().filter((q) =>
      FILTER === "all" ? true : FILTER === "done" ? q.reviewed : !q.reviewed && q.flagged);

    async function loadQueue() {
      const r = await (await fetch("/api/queue")).json();
      EVAL = r.receipts; UPLOADS = r.uploads || [];
      const list = all();
      const done = list.filter((q) => q.reviewed).length;
      const needs = list.filter((q) => !q.reviewed && q.flagged).length;
      $("m-progress").textContent = `${done}/${list.length}`;
      $("m-bar").style.width = list.length ? (done / list.length * 100) + "%" : "0";
      $("m-auto").textContent = Math.round(r.stats.auto_accept_rate * 100) + "%";
      $("m-acc").textContent = (r.stats.accept_accuracy * 100).toFixed(1) + "%";
      $("c-review").textContent = needs;
      $("c-all").textContent = list.length;
      $("c-done").textContent = done;
      renderQueue();
    }

    function renderQueue() {
      const wrap = $("list");
      wrap.innerHTML = "";
      const rows = visible();
      if (!rows.length) {
        const e = document.createElement("div");
        e.className = "kick";
        e.style.cssText = "padding:22px 12px;text-align:center";
        e.textContent = FILTER === "review" ? "queue clear" : "nothing here";
        wrap.appendChild(e);
        return;
      }
      let lastUp = null;
      rows.forEach((q) => {
        if (q.uploaded !== lastUp) {
          lastUp = q.uploaded;
          const g = document.createElement("div");
          g.className = "group kick";
          g.textContent = q.uploaded ? "uploads" : "eval set";
          wrap.appendChild(g);
        }
        const b = document.createElement("button");
        b.className = "row" + (q.reviewed ? " done" : "") + (CURRENT === q.id ? " on" : "");
        const pill = q.reviewed
          ? '<span class="pill done">done</span>'
          : q.flagged ? `<span class="pill flag">${q.flagged}</span>`
                      : '<span class="pill clear">clear</span>';
        const n = Number(q.id.replace("u", "")) + 1;
        b.innerHTML = `<span class="row-i">${q.uploaded ? "↑" : ""}${n}</span>
                       <span class="row-t">${esc(q.store)}</span>${pill}`;
        b.onclick = () => openReceipt(q.id);
        wrap.appendChild(b);
      });
    }

    function renderFields(r) {
      const wrap = $("fields");
      wrap.innerHTML = "";
      for (const f of r.fields) {
        const d = document.createElement("div");
        d.className = "f" + (f.accepted ? "" : " flag");
        const val = f.accepted
          ? `<span class="f-v${f.value == null ? " none" : ""}">${f.value == null ? "not present" : esc(f.value)}</span>`
          : `<input data-field="${f.name}" value="${f.value == null ? "" : esc(f.value)}"
               placeholder="not present" spellcheck="false" />`;
        const tag = f.accepted
          ? '<span class="f-tag auto">auto</span>'
          : `<span class="f-tag rev">${f.flag || "review"}</span>`;
        d.innerHTML = `<span class="f-k">${LABELS[f.name] || f.name}</span>
          <span>${val}</span>
          <span class="f-s">${tag}<span class="meter"><i style="width:${Math.round(f.confidence * 100)}%"></i></span></span>`;
        wrap.appendChild(d);
      }
      if (r.line_items && r.line_items.length) {
        const box = document.createElement("div");
        box.className = "items";
        box.innerHTML = `<div class="kick" style="padding:12px 0 7px">line items · ${r.line_items.length}</div>` +
          r.line_items.map((it) =>
            `<div class="item"><span>${esc(it.description ?? "-")}</span>
             <span>${it.price == null ? "" : esc(it.price)}</span></div>`).join("");
        wrap.appendChild(box);
      }
    }

    async function openReceipt(id) {
      CURRENT = id;
      renderQueue();
      const r = await (await fetch("/api/receipt/" + id)).json();
      // key the URL to the asset: ids are positional and get reused, so
      // /api/image/u0 alone would serve a stale cached image after a reset
      $("img").src = `/api/image/${id}?v=${r.file || ""}`;
      const list = r.uploaded ? UPLOADS : EVAL;
      const pos = list.findIndex((q) => q.id === id) + 1;
      $("insp-meta").textContent = r.uploaded
        ? `upload ${pos} · extracted in ${r.elapsed ?? "?"}s`
        : `eval receipt ${pos} of ${EVAL.length}`;
      $("insp-title").textContent =
        r.fields.find((f) => f.name === "store_name")?.value || "Unknown store";
      renderFields(r);
      $("save-note").textContent = r.review ? "reviewed earlier" : "";
      const first = $("fields").querySelector("input");
      if (first) first.focus({ preventScroll: true });
    }

    $("save").onclick = async () => {
      if (CURRENT == null) return;
      const corrections = {};
      document.querySelectorAll("#fields input").forEach((i) => {
        corrections[i.dataset.field] = i.value || null;
      });
      await fetch(`/api/receipt/${CURRENT}/review`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ corrections }),
      });
      const was = CURRENT;
      const pool = visible();
      const at = pool.findIndex((q) => q.id === was);
      const next = pool[at + 1] || pool[at - 1];
      await loadQueue();
      if (next && next.id !== was) openReceipt(next.id);
      else { $("save-note").textContent = "saved"; renderQueue(); }
    };

    document.querySelectorAll(".filters button").forEach((b) => {
      b.onclick = () => {
        document.querySelectorAll(".filters button").forEach((x) => x.classList.remove("on"));
        b.classList.add("on");
        FILTER = b.dataset.f;
        renderQueue();
      };
    });

    /* ── upload ── */
    const drop = $("drop"), note = $("drop-note");
    let busy = false;

    async function send(fileObj) {
      if (busy || !fileObj) return;
      busy = true;
      drop.classList.add("busy");
      const items = $("opt-items").checked;
      note.innerHTML = `reading${items ? " + line items" : ""}<span class="bar"><i></i></span>`;
      const fd = new FormData();
      fd.append("file", fileObj);
      try {
        const res = await fetch(`/api/extract?k=3&items=${items}`, { method: "POST", body: fd });
        if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
        const out = await res.json();
        note.textContent = `done in ${out.elapsed}s`;
        await loadQueue();
        openReceipt(out.id);
      } catch (err) {
        note.textContent = "failed: " + err.message;
      } finally {
        busy = false;
        drop.classList.remove("busy", "over");
        $("file").value = "";
      }
    }

    $("file").onchange = (e) => send(e.target.files[0]);
    ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => {
      e.preventDefault(); if (!busy) drop.classList.add("over");
    }));
    ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => {
      e.preventDefault(); drop.classList.remove("over");
    }));
    drop.addEventListener("drop", (e) => send(e.dataTransfer.files[0]));

    (async function pollReady() {
      try {
        const s = await (await fetch("/api/status")).json();
        if (s.error) { $("model-state").textContent = "model unavailable"; return; }
        if (s.ready) { $("model-state").textContent = "model ready"; return; }
        $("model-state").textContent = "warming model";
      } catch (e) { $("model-state").textContent = "reconnecting"; }
      setTimeout(pollReady, 3000);
    })();

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); $("save").click(); return; }
      if (e.target.tagName === "INPUT") return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        const pool = visible();
        const i = pool.findIndex((q) => q.id === CURRENT);
        const n = e.key === "ArrowDown" ? i + 1 : i - 1;
        if (n >= 0 && n < pool.length) openReceipt(pool[n].id);
      }
    });

    loadQueue().then(() => {
      const first = visible()[0] || all()[0];
      if (first) openReceipt(first.id);
    });
  </script>
</body>
</html>
